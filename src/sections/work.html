<section class="work" id="work">
  <div class="work-header">
    <h2 data-i18n="work.h2">Деякі речі,<br>які я <em>зробив.</em></h2>
    <div class="work-note" data-i18n="work.note">маленька вибірка — пишіть за повним списком
      <span style="display:block;font-size:26px;transform:rotate(40deg);margin-top:-10px">→</span>
    </div>
  </div>
  <div id="cases-container" tabindex="0" role="region" aria-label="Project slider"></div>
