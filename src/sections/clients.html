<section class="clients" id="clients" aria-labelledby="clients-title">
  <div class="clients-copy">
    <div class="section-tag">Client map</div>
    <h2 id="clients-title">Trusted across<br><em>four countries.</em></h2>
    <p>Remote collaboration that feels close — clear communication, reliable delivery and websites built for real businesses.</p>
    <div class="client-countries" aria-label="Client countries">
      <button type="button" data-country="usa"><span>01</span>United States</button>
      <button type="button" data-country="canada"><span>02</span>Canada</button>
      <button type="button" data-country="ireland"><span>03</span>Ireland</button>
      <button type="button" data-country="ukraine"><span>04</span>Ukraine</button>
    </div>
  </div>
  <div class="globe-wrap">
    <canvas id="client-globe" width="640" height="640" tabindex="0" aria-label="Interactive globe showing client locations. Drag to rotate or use the arrow keys."></canvas>
    <div class="globe-tooltip" id="globe-tooltip" role="status" aria-live="polite"></div>
    <p class="globe-hint">Drag to explore <span aria-hidden="true">↔</span></p>
  </div>
</section>
